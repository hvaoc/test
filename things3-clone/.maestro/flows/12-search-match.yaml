# Search · "typing a query lists only matching tasks"
appId: com.functionofq.thingsclone
---
# recover to the sidebar root first, so this case is resilient to the previous one.
- runFlow: ../reset.yaml
- tapOn: { id: "sidebar-inbox" }
- tapOn: { id: "fab-add-task" }
- tapOn: { id: "detail-title" }
- inputText: "Zeta findme"
- tapOn: { id: "detail-back" }
- tapOn: { id: "fab-add-task" }
- tapOn: { id: "detail-title" }
- inputText: "Yotta hidden"
- tapOn: { id: "detail-back" }
- tapOn: { id: "list-back" }
- tapOn: { id: "sidebar-search" }
- tapOn: { id: "search-input" }
- inputText: "findme"
- assertVisible: "Zeta findme"
- assertNotVisible: "Yotta hidden"
- tapOn: { id: "search-back" }
