# Task fields · "add Notes to a task and see them persist"
appId: com.functionofq.thingsclone
---
# recover to the sidebar root first, so this case is resilient to the previous one.
- runFlow: ../reset.yaml
- tapOn: { id: "sidebar-inbox" }
- tapOn: { id: "fab-add-task" }
- tapOn: { id: "detail-title" }
- inputText: "Plan the offsite"
- tapOn: { id: "detail-notes" }
- inputText: "Book venue and send invites"
- tapOn: { id: "detail-back" }
- assertVisible: "Plan the offsite"
# reopen -> notes round-tripped
- tapOn: "Plan the offsite"
- assertVisible: "Book venue and send invites"
- tapOn: { id: "detail-back" }
- tapOn: { id: "list-back" }
