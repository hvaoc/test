# Task CRUD · "edit a task title"
appId: com.functionofq.thingsclone
---
# recover to the sidebar root first, so this case is resilient to the previous one.
- runFlow: ../reset.yaml
- tapOn: { id: "sidebar-inbox" }
- tapOn: { id: "fab-add-task" }
- tapOn: { id: "detail-title" }
- inputText: "Draft title"
- tapOn: { id: "detail-back" }
- assertVisible: "Draft title"
- tapOn: "Draft title"
- tapOn: { id: "detail-title" }
- eraseText: 15
- inputText: "Final title"
- tapOn: { id: "detail-back" }
- assertVisible: "Final title"
- assertNotVisible: "Draft title"
- tapOn: { id: "list-back" }
