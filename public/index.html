<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🗺️ PlayMap — your neighbourhood, live</title>

    <!-- Leaflet (renders the real OpenStreetMap tiles) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="map"></div>

    <!-- Game-style heads-up display -->
    <header class="hud-top">
      <div class="logo">🗺️ <span>PlayMap</span></div>
      <div id="status" class="status status--demo">connecting…</div>
    </header>

    <!-- Live activity feed -->
    <aside class="feed" id="feed-panel">
      <div class="feed__header">
        <span>✨ Happening now</span>
        <button id="feed-toggle" class="feed__toggle" title="Hide / show feed">—</button>
      </div>
      <ul class="feed__list" id="feed-list"></ul>
    </aside>

    <!-- Post-an-activity controls -->
    <div class="dock">
      <button id="post-btn" class="dock__btn dock__btn--primary">➕ Post an activity</button>
      <button id="locate-btn" class="dock__btn" title="Centre on me">📍</button>
    </div>

    <!-- Activity composer (hidden until "Post an activity" is pressed) -->
    <div class="composer" id="composer" hidden>
      <div class="composer__card">
        <h2>Drop something on the map 🎈</h2>
        <p class="composer__hint" id="composer-hint">Pick a vibe, then tap the map to place it.</p>

        <div class="composer__types" id="composer-types"></div>

        <label class="composer__field">
          <span>What's up?</span>
          <input id="composer-title" type="text" maxlength="120" placeholder="e.g. Free cupcakes at the park!" />
        </label>
        <label class="composer__field">
          <span>Your name</span>
          <input id="composer-author" type="text" maxlength="40" placeholder="Sparkly Otter" />
        </label>

        <div class="composer__actions">
          <button id="composer-cancel" class="dock__btn">Cancel</button>
          <button id="composer-place" class="dock__btn dock__btn--primary">Tap map to place 👉</button>
        </div>
      </div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <!-- Socket.IO client. If the backend isn't running, app.js falls back to
         a built-in client-side simulator so the prototype still works. -->
    <script src="/socket.io/socket.io.js" onerror="window.__noSocket = true"></script>
    <script src="app.js"></script>
  </body>
</html>
